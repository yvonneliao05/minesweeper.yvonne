<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>反向踩地雷</title>
<style>
  :root {
    --bg: #eef1f5;
    --panel: #ffffff;
    --text: #1f2933;
    --muted: #6b7785;
    --cell: #c9d3df;
    --cell-hover: #b8c4d3;
    --open: #f7f9fb;
    --border: #d6dde6;
    --accent: #3b82f6;
    --boom: #ef4444;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181d;
      --panel: #1d232a;
      --text: #e6ebf0;
      --muted: #8b97a5;
      --cell: #3a4552;
      --cell-hover: #475464;
      --open: #252c34;
      --border: #2e3741;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    user-select: none;
  }
  h1 { margin: 0 0 16px; font-size: 28px; letter-spacing: 2px; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 16px;
  }
  .controls button {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  .controls button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .game {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 6px 24px rgba(0,0,0,.08);
    max-width: 100%;
  }
  .status {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; gap: 12px;
  }
  .counter {
    font-family: Consolas, monospace;
    font-size: 22px; font-weight: bold;
    background: #111; color: #ff4d4d;
    padding: 4px 10px; border-radius: 6px; min-width: 70px; text-align: center;
  }
  #face {
    font-size: 26px; width: 46px; height: 46px;
    border-radius: 10px; border: 1px solid var(--border);
    background: var(--open); cursor: pointer;
  }
  .board-wrap { overflow: auto; max-width: calc(100vw - 64px); }
  .board { display: grid; gap: 2px; }
  .cell {
    width: 30px; height: 30px;
    background: var(--cell);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px;
    cursor: pointer;
    transition: background .1s;
  }
  .cell:hover:not(.open) { background: var(--cell-hover); }
  .cell.open { background: var(--open); cursor: default; }
  .cell.boom { background: var(--boom); }
  .cell.wrong { background: #fbbf24; }
  .n0 { color: #e11d48; } .n1 { color: #2563eb; } .n2 { color: #16a34a; } .n3 { color: #dc2626; }
  .n4 { color: #7c3aed; } .n5 { color: #b45309; } .n6 { color: #0891b2; }
  .n7 { color: #374151; } .n8 { color: #9ca3af; }
  @media (prefers-color-scheme: dark) {
    .n1 { color: #60a5fa; } .n2 { color: #4ade80; } .n3 { color: #f87171; }
    .n4 { color: #c084fc; } .n7 { color: #e5e7eb; }
  }
  .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 10px; flex-wrap: wrap; }
  #flagMode {
    border: 1px solid var(--border); background: var(--open); color: var(--text);
    padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  #flagMode.on { background: #f59e0b; color: #fff; border-color: #f59e0b; }
  .hint { color: var(--muted); font-size: 13px; }
  #msg { height: 24px; margin-top: 14px; font-size: 18px; font-weight: bold; }
  .custom { display: none; gap: 6px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; justify-content: center; }
  .custom.show { display: flex; }
  .custom input { width: 64px; padding: 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
</style>
</head>
<body>
  <h1>🔄 反向踩地雷</h1>
  <p class="hint" style="margin:-8px 0 14px;text-align:center">數字代表周圍「沒有地雷」的格子數（邊角格子周圍本來就比較少格）</p>

  <div class="controls">
    <button data-level="easy" class="active">初級 9×9</button>
    <button data-level="medium">中級 16×16</button>
    <button data-level="hard">高級 30×16</button>
    <button data-level="custom">自訂</button>
  </div>

  <div class="custom" id="customBox">
    寬 <input id="cw" type="number" min="5" max="40" value="20">
    高 <input id="ch" type="number" min="5" max="30" value="12">
    地雷 <input id="cm" type="number" min="1" value="40">
    <button id="customGo" style="padding:6px 12px;border-radius:6px;border:none;background:var(--accent);color:#fff;cursor:pointer">開始</button>
  </div>

  <div class="game">
    <div class="status">
      <div class="counter" id="mines">010</div>
      <button id="face" title="重新開始">🙂</button>
      <div class="counter" id="timer">000</div>
    </div>
    <div class="board-wrap"><div class="board" id="board"></div></div>
    <div class="footer">
      <button id="flagMode">🚩 插旗模式：關</button>
      <span class="hint">左鍵翻開・右鍵插旗・點數字快速翻開・空白格＝周圍全安全</span>
    </div>
  </div>
  <div id="msg"></div>

<script>
const LEVELS = {
  easy:   { w: 9,  h: 9,  m: 10 },
  medium: { w: 16, h: 16, m: 40 },
  hard:   { w: 30, h: 16, m: 99 },
};

let W, H, M, cells, firstClick, over, flags, opened, timer, seconds, flagMode = false;
const boardEl = document.getElementById('board');
const minesEl = document.getElementById('mines');
const timerEl = document.getElementById('timer');
const faceEl = document.getElementById('face');
const msgEl = document.getElementById('msg');
const flagBtn = document.getElementById('flagMode');
let current = LEVELS.easy;

const pad = n => (n < 0 ? '-' + String(-n).padStart(2, '0') : String(n).padStart(3, '0'));

function neighbors(i) {
  const x = i % W, y = Math.floor(i / W), res = [];
  for (let dy = -1; dy <= 1; dy++)
    for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = x + dx, ny = y + dy;
      if (nx >= 0 && nx < W && ny >= 0 && ny < H) res.push(ny * W + nx);
    }
  return res;
}

function newGame(cfg = current) {
  current = cfg;
  W = cfg.w; H = cfg.h; M = Math.min(cfg.m, W * H - 9);
  cells = Array.from({ length: W * H }, () => ({ mine: false, open: false, flag: false, n: 0, s: 0 }));
  firstClick = true; over = false; flags = 0; opened = 0; seconds = 0;
  clearInterval(timer); timer = null;
  faceEl.textContent = '🙂'; msgEl.textContent = '';
  timerEl.textContent = pad(0);
  updateMines();

  const size = W > 20 ? 26 : 30;
  boardEl.style.gridTemplateColumns = `repeat(${W}, ${size}px)`;
  boardEl.innerHTML = '';
  cells.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'cell';
    d.style.width = d.style.height = size + 'px';
    d.dataset.i = i;
    c.el = d;
    boardEl.appendChild(d);
  });
}

function placeMines(safe) {
  const forbidden = new Set([safe, ...neighbors(safe)]);
  const pool = [];
  for (let i = 0; i < W * H; i++) if (!forbidden.has(i)) pool.push(i);
  for (let k = 0; k < M; k++) {
    const r = k + Math.floor(Math.random() * (pool.length - k));
    [pool[k], pool[r]] = [pool[r], pool[k]];
    cells[pool[k]].mine = true;
  }
  // n：周圍地雷數（內部邏輯用）；s：周圍安全格數（顯示給玩家看）
  cells.forEach((c, i) => {
    const nb = neighbors(i);
    c.n = nb.filter(j => cells[j].mine).length;
    c.s = nb.length - c.n;
  });
}

function updateMines() { minesEl.textContent = pad(M - flags); }

function startTimer() {
  timer = setInterval(() => {
    seconds = Math.min(999, seconds + 1);
    timerEl.textContent = pad(seconds);
  }, 1000);
}

function reveal(i) {
  const stack = [i];
  while (stack.length) {
    const k = stack.pop();
    const c = cells[k];
    if (c.open || c.flag) continue;
    c.open = true; opened++;
    c.el.classList.add('open');
    if (c.mine) return lose(k);
    if (c.n) { c.el.textContent = c.s; c.el.classList.add('n' + c.s); }
    else neighbors(k).forEach(j => { if (!cells[j].open) stack.push(j); });
  }
  return true;
}

function openCell(i) {
  if (over) return;
  const c = cells[i];
  if (firstClick) { placeMines(i); firstClick = false; startTimer(); }
  if (c.flag) return;
  if (c.open) {
    // 和弦：周圍旗數等於地雷數（周圍格數 − 顯示數字）時，翻開其餘格子
    if (!c.n) return;
    const nb = neighbors(i);
    if (nb.filter(j => cells[j].flag).length !== c.n) return;
    for (const j of nb) if (!cells[j].open && !cells[j].flag) { if (reveal(j) === false) return; }
  } else {
    if (reveal(i) === false) return;
  }
  checkWin();
}

function toggleFlag(i) {
  if (over || firstClick) return;
  const c = cells[i];
  if (c.open) return;
  c.flag = !c.flag;
  flags += c.flag ? 1 : -1;
  c.el.textContent = c.flag ? '🚩' : '';
  updateMines();
}

function lose(k) {
  over = true; clearInterval(timer);
  faceEl.textContent = '😵';
  msgEl.textContent = '💥 踩到地雷了！點擊表情重新開始';
  cells.forEach((c, i) => {
    if (c.mine && !c.flag) { c.el.textContent = '💣'; c.el.classList.add('open'); }
    if (!c.mine && c.flag) { c.el.textContent = '❌'; c.el.classList.add('wrong'); }
  });
  cells[k].el.classList.add('boom');
  return false;
}

function checkWin() {
  if (over || opened !== W * H - M) return;
  over = true; clearInterval(timer);
  faceEl.textContent = '😎';
  cells.forEach(c => { if (c.mine && !c.flag) { c.flag = true; c.el.textContent = '🚩'; } });
  flags = M; updateMines();
  msgEl.textContent = `🎉 恭喜過關！用時 ${seconds} 秒`;
}

// 滑鼠事件
boardEl.addEventListener('click', e => {
  const i = e.target.dataset.i; if (i === undefined) return;
  const c = cells[+i];
  if (flagMode && !c.open) toggleFlag(+i); else openCell(+i);
});
boardEl.addEventListener('contextmenu', e => {
  e.preventDefault();
  const i = e.target.dataset.i; if (i === undefined) return;
  toggleFlag(+i);
});
boardEl.addEventListener('mousedown', e => { if (!over && e.button === 0) faceEl.textContent = '😮'; });
document.addEventListener('mouseup', () => { if (!over) faceEl.textContent = '🙂'; });

// 手機長按插旗
let pressTimer = null, longPressed = false;
boardEl.addEventListener('touchstart', e => {
  const i = e.target.dataset.i; if (i === undefined) return;
  longPressed = false;
  pressTimer = setTimeout(() => { longPressed = true; toggleFlag(+i); if (navigator.vibrate) navigator.vibrate(30); }, 400);
}, { passive: true });
boardEl.addEventListener('touchend', e => {
  clearTimeout(pressTimer);
  if (longPressed) e.preventDefault();
});
boardEl.addEventListener('touchmove', () => clearTimeout(pressTimer), { passive: true });

faceEl.addEventListener('click', () => newGame());
flagBtn.addEventListener('click', () => {
  flagMode = !flagMode;
  flagBtn.classList.toggle('on', flagMode);
  flagBtn.textContent = `🚩 插旗模式：${flagMode ? '開' : '關'}`;
});

document.querySelectorAll('.controls button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.controls button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    const lv = b.dataset.level;
    document.getElementById('customBox').classList.toggle('show', lv === 'custom');
    if (lv !== 'custom') newGame(LEVELS[lv]);
  });
});
document.getElementById('customGo').addEventListener('click', () => {
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v | 0));
  const w = clamp(document.getElementById('cw').value, 5, 40);
  const h = clamp(document.getElementById('ch').value, 5, 30);
  const m = clamp(document.getElementById('cm').value, 1, w * h - 9);
  newGame({ w, h, m });
});

newGame();
</script>
</body>
</html>
